# All thresholds and choices for the Boston MBTA bus delay analysis and delay prediction project.
paths:
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  outputs_dir: outputs

time_buckets:                      # hour-of-day (0-23), start inclusive, end exclusive
  AM_PEAK: [7, 10]
  PM_PEAK: [17, 20]                # everything else is OFF_PEAK

spark:
  shuffle_partitions: 8            # fixed for every run
  driver_memory: 4g
  adaptive_enabled: false          # off so the join strategy is not changed at run time

benchmark:
  cores: [1, 2, 4]

# ---- Scheduled-vs-actual delay analysis (Boston MBTA bus, 2024) ----
delay:
  raw_dir: data/raw_delay/extracted/MBTA_Bus_Arrival_Departure_Times_2024
  file_pattern: "MBTA-Bus-Arrival-Departure-Times_2024-{month:02d}.csv"
  months: [1, 4, 7, 10]            # one month per season (~9M rows); use 1..12 for the full year
  interim_dir: data/interim_delay
  on_time_early_sec: -60           # on time = between 1 min early and 5 min late (common bus standard)
  on_time_late_sec: 300
  max_abs_delay_sec: 7200          # |delay| above 2 h is treated as a data error
  min_events: 100                  # min observations per route/segment before ranking
  headway_bunch_ratio: 0.5         # bunched = actual headway < 0.5 x scheduled
  headway_gap_ratio: 1.5           # gap = actual headway > 1.5 x scheduled
  bench_timed_runs: 1              # quick protocol: ONE timed run per core count, no warm-up (disclosed in the results)
  bench_warmup_runs: 0
  bench_driver_memory: 6g

# ---- Delay prediction (Spark MLlib gradient-boosted trees) ----
delay_model:
  test_fraction: 0.25              # last 25% of the days of EVERY month are held out for testing (temporal split)
  max_train_rows: 1000000          # training sample cap so local-mode training stays in minutes (disclosed in results)
  gbt_max_iter: 40                 # boosting rounds
  gbt_max_depth: 5
  max_bins: 256                    # must be >= number of route categories (raised automatically if needed)
  seed: 42
  bench_timed_runs: 1              # quick protocol: ONE timed run per core count, no warm-up (disclosed in the results)
  bench_warmup_runs: 0
